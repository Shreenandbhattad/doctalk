<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DocTalk</title>
<meta name="description" content="Talk through what is bothering you, in private, and get a clear picture of it. Nothing leaves your phone.">
<meta name="theme-color" content="#F4F8F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1711" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DocTalk">
<meta property="og:title" content="DocTalk">
<meta property="og:description" content="Say it out loud once, in private, and see it clearly.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css?v=2">
</head>
<body>

<div class="aur" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>

<main id="stage" class="stage">
  <!-- every screen is painted here -->
</main>

<div class="disclaim" id="disclaim">Private on your phone. Not a diagnosis.</div>

<div id="toast" role="status" aria-live="polite"></div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="flag" id="flag" hidden></div>

<script src="js/core.js?v=2"></script>
<script src="js/motion.js?v=2"></script>
<script src="js/orb.js?v=2"></script>
<script src="js/speech.js?v=2"></script>
<script src="js/interview.js?v=2"></script>
<script src="js/card.js?v=2"></script>
<script src="js/scan.js?v=2"></script>
<script src="js/app.js?v=2"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      if(reg.waiting) reg.waiting.postMessage('skipWaiting');
      reg.addEventListener('updatefound', function(){
        var w = reg.installing;
        if(w) w.addEventListener('statechange', function(){
          if(w.state === 'installed' && navigator.serviceWorker.controller) w.postMessage('skipWaiting');
        });
      });
    }).catch(function(){});
  });
}
</script>
</body>
</html>
